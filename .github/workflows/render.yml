name: Render batching
on:
  push:
    branches: [feat/metro-overlay]
    paths: ['core/**', 'scripts/test-tile-write-batch.sh', '.github/workflows/render.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: scripts/test-tile-write-batch.sh
